server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10M;

    # Assets com hash (Vite): cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        try_files $uri =404;
    }

    # index.html nunca cacheado (sistema de updates OTA)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
    }

    # Uploads (logos/campanhas) ficam no backend — necessario quando o
    # frontend e acessado direto pela porta publicada, sem passar pelo nginx principal
    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri /index.html;
    }
}
