# ============================================================
# Nginx - Reverse Proxy Principal (Prod)
# Substitua DOMAIN_HOTSPOT e DOMAIN_EVOLUTION nas variaveis
# do compose ou aqui diretamente.
# ============================================================

# --- Hotspot Panel ---
server {
    listen 80;
    server_name ${DOMAIN_HOTSPOT} _;

    client_max_body_size 10M;

    # Resolver interno do Docker: re-resolve o IP dos containers a cada 10s.
    # proxy_pass com variavel forca o nginx a resolver em runtime — sem isso,
    # recriar backend/frontend muda o IP e o nginx fica preso no antigo (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream http://frontend:${FRONTEND_CONTAINER_PORT};
    set $backend_upstream http://backend:3001;

    # Passa real IP quando atras de Traefik/CDN
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Frontend (container ou dist local)
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        # sem URI no proxy_pass (com variavel, a URI original e preservada)
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
    }

    # Hotspot captive portal
    location /hotspot/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads (campanhas e logos) servidos pelo backend
    location /uploads/ {
        proxy_pass $backend_upstream;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
}

# --- Evolution API ---
server {
    listen 80;
    server_name ${DOMAIN_EVOLUTION};

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $evolution_upstream http://evolution-api:8080;

    location / {
        proxy_pass $evolution_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
