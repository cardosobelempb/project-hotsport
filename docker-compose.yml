# ============================================================
# docker-compose.yml — BASE (compartilhado entre dev e prod)
# Use com: docker-compose.dev.yml ou docker-compose.prod.yml
# ============================================================

services:
  # ---- MySQL (banco principal) ----
  mysql:
    image: mysql:8.0
    container_name: hotspot-mysql
    restart: unless-stopped
    # mysql_native_password (em vez do padrao caching_sha2_password do MySQL 8):
    # o cliente "mysql" do Alpine (pacote mysql-client, na verdade cliente do
    # MariaDB, usado pelo backend node:20-alpine em scripts/runMigrations.js
    # pra aplicar o estrutura.sql) nao tem o plugin caching_sha2_password.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/jobs/estrutura.sql:/docker-entrypoint-initdb.d/01-estrutura.sql:ro
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    networks:
      - hotspot-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---- PostgreSQL (Evolution API) ----
  postgres:
    image: postgres:15-alpine
    container_name: hotspot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    networks:
      - hotspot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---- Evolution API (WhatsApp) ----
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: hotspot-evolution
    restart: unless-stopped
    environment:
      SERVER_URL: https://${DOMAIN_EVOLUTION}
      DOCKER_ENV: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      CACHE_REDIS_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVO_API_KEY}
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1035629803"
    volumes:
      - evolution_data:/evolution/instances
    ports:
      - "${EVO_HOST_PORT:-8080}:8080"
    networks:
      - hotspot-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8080/ 2>/dev/null || curl -sf http://localhost:8080/ > /dev/null 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---- WireGuard ----
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: hotspot-wireguard
    restart: unless-stopped
    env_file:
      - wg-password.env
    environment:
      - WG_HOST=${WG_HOST}
      - PORT=${WG_PANEL_PORT:-51950}
      - WG_PORT=${WG_VPN_PORT:-51820}
    ports:
      - "${WG_VPN_PORT:-51820}:${WG_VPN_PORT:-51820}/udp"
      - "${WG_PANEL_PORT:-51950}:${WG_PANEL_PORT:-51950}/tcp"
      # Portas RADIUS publicadas aqui porque o freeradius compartilha esta
      # network namespace (network_mode: service:wg-easy)
      - "1812:1812/udp"
      - "1813:1813/udp"
      - "3799:3799/udp"
    volumes:
      - wireguard_data:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - hotspot-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:${WG_PANEL_PORT:-51950}/ 2>/dev/null || curl -sf http://localhost:${WG_PANEL_PORT:-51950}/ > /dev/null 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---- FreeRADIUS ----
  # Compartilha a network namespace do wg-easy: o RADIUS escuta direto no
  # 10.8.0.1:1812 do tunel WireGuard, e o IP de origem dos MikroTiks (10.8.0.x)
  # e preservado — bate com o nasname da tabela `nas`.
  # ATENCAO: se o wg-easy for recriado, recrie o freeradius junto.
  freeradius:
    build:
      context: .
      dockerfile: docker/freeradius/Dockerfile
    image: ${REGISTRY:-hotspot}/freeradius:${IMAGE_TAG:-latest}
    container_name: hotspot-freeradius
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    network_mode: "service:wg-easy"
    depends_on:
      mysql:
        condition: service_healthy
      wg-easy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x freeradius > /dev/null || pgrep -x radiusd > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- Backend Node.js ----
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: ${REGISTRY:-hotspot}/backend:${IMAGE_TAG:-latest}
    container_name: hotspot-backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SYSTEM_DOMAIN: ${SYSTEM_DOMAIN}
      SYSTEM_PROTO: ${SYSTEM_PROTO:-https}
      SYSTEM_PORT: ${SYSTEM_PORT:-}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVO_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-hotspot}
      WG_EASY_HOST: ${WG_EASY_HOST:-wg-easy}
      WG_HOST: ${WG_HOST}
      WG_PASS: ${WG_PASS}
      WG_PANEL_PORT: ${WG_PANEL_PORT:-51950}
      WG_VPN_PORT: ${WG_VPN_PORT:-51820}
      # freeradius compartilha a netns do wg-easy, entao o hostname 'freeradius'
      # nao existe mais na rede — o health check usa o alias do wg-easy
      RADIUS_HOST: wg-easy
      # Segredo RADIUS compartilhado: DEVE bater com clients.conf (docker_bridge_10).
      # Default 'testing123' alinhado com clients.conf. Para alterar, mude aqui
      # E em freeradius_conf/3.0/clients.conf (rebuild do container freeradius).
      RADIUS_SECRET: ${RADIUS_SECRET:-testing123}
      UPDATE_SERVER_URL: https://glpi.forumtelecom.com.br
    ports:
      - "${BACKEND_HOST_PORT:-3001}:3001"
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    networks:
      - hotspot-net
    # REVERTIDO: "network_mode: service:wg-easy" (testado no ambiente
    # Coolify) quebrou o roteamento do Traefik pro backend - container
    # nesse modo nao tem NetworkSettings.Networks proprio, entao proxies
    # baseados em descoberta via Docker API (Traefik) nao acham IP pra ele.
    # O acesso do backend ao tunel WireGuard (10.8.0.x, MikroTiks atras de
    # NAT) continua pendente - precisa de outra estrategia.
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---- Frontend ----
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: ${REGISTRY:-hotspot}/frontend:${IMAGE_TAG:-latest}
    container_name: hotspot-frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:3001
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:-5173}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:${FRONTEND_CONTAINER_PORT:-5173}"
    networks:
      - hotspot-net
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:${FRONTEND_CONTAINER_PORT:-5173}/ 2>/dev/null || curl -sf http://localhost:${FRONTEND_CONTAINER_PORT:-5173}/ > /dev/null 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---- Nginx (reverse proxy) ----
  nginx:
    image: nginx:alpine
    container_name: hotspot-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/templates:ro
    environment:
      DOMAIN_HOTSPOT: ${DOMAIN_HOTSPOT}
      DOMAIN_EVOLUTION: ${DOMAIN_EVOLUTION}
      FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:-5173}
    command: >
      /bin/sh -c "envsubst '$$DOMAIN_HOTSPOT $$DOMAIN_EVOLUTION $$FRONTEND_CONTAINER_PORT'
      < /etc/nginx/templates/hotspot.conf
      > /etc/nginx/conf.d/hotspot.conf
      && rm -f /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    networks:
      - hotspot-net
    depends_on:
      - backend
      - frontend
      - evolution-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost/ 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
  postgres_data:
  evolution_data:
  wireguard_data:
  backend_uploads:
  backend_backups:

networks:
  hotspot-net:
    driver: bridge
