# ============================================================
# docker-compose.coolify.yml - Deploy via Coolify
#
# Ambiente NOVO e separado do stack Traefik/Portainer existente
# (docker-compose.prod.yml). Sobe o proprio MySQL dentro do compose
# (self-contained) - nao depende de recurso Database separado no Coolify.
# Evolution API continua externa (opcional, via EVOLUTION_*).
#
# Como usar no Coolify:
# 1. Repositorio git conectado ao projeto (Coolify precisa clonar via git).
# 2. Criar um recurso "Docker Compose" apontando pra este arquivo.
# 3. Preencher as variaveis de ambiente do projeto no Coolify (ver
#    .env.coolify.example) - Coolify injeta como ${VAR} na hora do deploy.
# 4. Configurar dominio (FQDN) por servico na UI do Coolify:
#      - frontend -> dominio raiz (ex: https://hotspot.seudominio.com)
#      - backend  -> mesmo dominio + paths /api, /uploads, /hotspot, /emergency
#    Coolify gera os labels do proxy automaticamente, por isso este arquivo
#    NAO declara labels Traefik nem rede externa do proxy.
# 5. Portas de WireGuard/RADIUS nao passam pelo proxy HTTP do Coolify -
#    precisam estar liberadas no firewall da VPS manualmente.
#
# Detalhes completos: docs/COOLIFY-DEPLOY.md
# ============================================================

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # mysql_native_password (em vez do padrao caching_sha2_password do MySQL 8):
    # o cliente "mysql" do Alpine (pacote mysql-client, na verdade o cliente do
    # MariaDB) nao tem o plugin caching_sha2_password - falha com "ERROR 1045:
    # Plugin caching_sha2_password could not be loaded" ao tentar autenticar.
    # O backend (node:20-alpine) usa esse cliente pra aplicar o estrutura.sql
    # (scripts/runMigrations.js) - sem isso o seed falha silenciosamente e o
    # banco fica sem as tabelas base.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-hotspot}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/jobs/estrutura.sql:/docker-entrypoint-initdb.d/01-estrutura.sql:ro
    networks:
      - hotspot-internal
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-hotspot}
      JWT_SECRET: ${JWT_SECRET}
      SYSTEM_DOMAIN: ${SYSTEM_DOMAIN}
      SYSTEM_PROTO: https
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-hotspot}
      WG_EASY_HOST: wg-easy
      WG_HOST: ${WG_HOST}
      WG_PASS: ${WG_PASS}
      WG_PANEL_PORT: ${WG_PANEL_PORT:-51950}
      WG_VPN_PORT: ${WG_VPN_PORT:-51820}
      # freeradius compartilha a netns do wg-easy (ver servico abaixo) - o
      # health check do RADIUS usa o alias do wg-easy, nao "freeradius"
      RADIUS_HOST: wg-easy
      UPDATE_SERVER_URL: ${UPDATE_SERVER_URL:-https://glpi.forumtelecom.com.br}
    expose:
      - "3001"
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups
    networks:
      - hotspot-internal
    # NET_ADMIN: precisa pra "ip route add 10.8.0.0/24 via wg-easy" no boot
    # do container (Dockerfile CMD) - da acesso ao tunel WireGuard (MikroTiks
    # atras de NAT) SEM trocar a rede principal do backend (a tentativa
    # anterior, network_mode: service:wg-easy, quebrou o roteamento do
    # Traefik - container nesse modo nao tem NetworkSettings.Networks
    # proprio, o Traefik nao achava IP pra ele, 503 em tudo. Revertido e
    # confirmado ao vivo). Depende do servico wg-easy-nat-setup (ver abaixo)
    # aplicar MASQUERADE no wg-easy pro caminho de volta da resposta
    # funcionar - so a rota de ida nao basta.
    cap_add:
      - NET_ADMIN
    # Labels manuais (em vez de depender do campo de dominio/paths da UI do
    # Coolify pro backend) porque o recurso "multiplos paths" do Coolify gera
    # um middleware stripprefix que remove /api,/uploads,/hotspot,/emergency
    # antes de encaminhar - o backend registra as rotas COM esses prefixos
    # (app.use('/api/...')), entao o strip resultava em 404 pra tudo. Nomes de
    # entrypoint/certresolver (https/letsencrypt) confirmados inspecionando os
    # labels que o proprio Coolify gerou pro frontend deste mesmo recurso.
    #
    # ATENCAO: o dominio no rule abaixo esta FIXO (nao usa ${SYSTEM_DOMAIN}) -
    # confirmado que o pre-processamento do Coolify NAO interpola variaveis
    # dentro de "labels:" (o mesmo ${SYSTEM_DOMAIN} funciona normalmente no
    # bloco "environment:" do mesmo servico, so falha aqui). Se o dominio
    # mudar, editar a linha ".rule=" manualmente.
    #
    # traefik.docker.network: FIXO na UUID do projeto (nao "coolify"). Cada
    # projeto do Coolify ganha sua propria rede implicita nomeada com a UUID
    # do recurso (ex: a18a0r06eapf4tf6n3xk4ehz) - e' NELA que o container
    # tem IP alcancavel pelo proxy, nao na rede "coolify" (essa e' so do
    # painel do Coolify em si). Confirmado ao vivo: coolify-proxy alcancava
    # o backend pelo IP da rede <uuid>, mas dava timeout pelo IP da rede
    # hotspot-internal - com o label apontando "coolify" (rede errada, o
    # container nem esta nela), o Traefik nunca achava servidor valido e
    # ficava pendurado sem responder (sem nem logar erro). Se este compose
    # for reusado noutro recurso Coolify, trocar pela UUID do recurso novo
    # (aparece no nome dos containers, ex: backend-<uuid>-<timestamp>).
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=a18a0r06eapf4tf6n3xk4ehz"
      - "traefik.http.routers.hotspot-backend.rule=Host(`hotspot.surb.com.br`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/hotspot`) || Path(`/emergency`))"
      - "traefik.http.routers.hotspot-backend.entrypoints=https"
      - "traefik.http.routers.hotspot-backend.tls=true"
      - "traefik.http.routers.hotspot-backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hotspot-backend.priority=100"
      - "traefik.http.services.hotspot-backend.loadbalancer.server.port=3001"
    depends_on:
      mysql:
        condition: service_healthy
      wg-easy:
        condition: service_started
      wg-easy-nat-setup:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - hotspot-internal
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

  # Compartilha a network namespace do wg-easy: o RADIUS escuta direto no
  # 10.8.0.1:1812 do tunel WireGuard, e o IP de origem dos MikroTiks (10.8.0.x)
  # e preservado - bate com o nasname da tabela `nas`.
  # ATENCAO: se o wg-easy for recriado, recrie o freeradius junto.
  freeradius:
    build:
      context: .
      dockerfile: docker/freeradius/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-hotspot}
    network_mode: "service:wg-easy"
    depends_on:
      wg-easy:
        condition: service_started
      mysql:
        condition: service_healthy

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST}
      PORT: ${WG_PANEL_PORT:-51950}
      WG_PORT: ${WG_VPN_PORT:-51820}
      # Nao existe wg-password.env fisico apos o git clone do Coolify (esta no
      # .gitignore), entao a hash vai via variavel de ambiente comum. MESMA
      # REGRA do wg-password.env do stack Portainer/Swarm: o valor de
      # WG_PASS_HASH cadastrado no Coolify precisa ter TODO "$" dobrado para
      # "$$" (ex: hash "$2a$12$RMEf..." vira "$$2a$$12$$RMEf..." no valor da
      # variavel) - senao o Compose interpola o "$" do meio do hash como
      # inicio de outra variavel e zera a senha (warning "variable is not
      # set" no log de build). Ver .env.coolify.example.
      PASSWORD_HASH: ${WG_PASS_HASH}
    volumes:
      - wireguard_data:/etc/wireguard
    ports:
      - "${WG_VPN_PORT:-51820}:${WG_VPN_PORT:-51820}/udp"
      - "${WG_PANEL_PORT:-51950}:${WG_PANEL_PORT:-51950}/tcp"
      # Portas RADIUS publicadas aqui porque o freeradius compartilha esta
      # network namespace (network_mode: service:wg-easy)
      - "${RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${RADIUS_ACCT_PORT:-1813}:1813/udp"
      - "${RADIUS_COA_PORT:-3799}:3799/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - hotspot-internal

  # Sidecar que aplica MASQUERADE/FORWARD no wg-easy pro backend conseguir
  # usar o tunel WireGuard via rota especifica (ver "cap_add: NET_ADMIN" e
  # o "ip route add" no Dockerfile do backend). So a rota de ida nao basta:
  # o pacote chega no MikroTik, mas a resposta nao volta, porque o MikroTik
  # so sabe rotear de volta pro peer da VPN (10.8.0.x), nao pro IP real do
  # backend (outra rede Docker). O MASQUERADE faz o trafego do backend
  # parecer que saiu do proprio wg-easy (10.8.0.1) ao entrar no tunel, entao
  # a resposta volta certa. Roda como container separado (nao mexe no
  # entrypoint/init do wg-easy oficial), compartilhando a mesma netns dele -
  # aplica as regras uma vez (idempotente, "-C" checa antes de "-A") e fica
  # vivo (restart nao duplica regra).
  wg-easy-nat-setup:
    image: alpine:3.20
    network_mode: "service:wg-easy"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      - wg-easy
    command: >
      sh -c "
        apk add --no-cache iptables >/dev/null 2>&1;
        iptables -t nat -C POSTROUTING -o wg0 -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -o wg0 -j MASQUERADE;
        iptables -C FORWARD -o wg0 -j ACCEPT 2>/dev/null || iptables -A FORWARD -o wg0 -j ACCEPT;
        iptables -C FORWARD -i wg0 -j ACCEPT 2>/dev/null || iptables -A FORWARD -i wg0 -j ACCEPT;
        echo 'NAT/forward aplicados para o tunel WireGuard';
        tail -f /dev/null
      "

volumes:
  mysql_data:
  backend_uploads:
  backend_backups:
  wireguard_data:

networks:
  hotspot-internal:
    driver: bridge
